<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Zygisk OmniSched</title>
    <style>
        :root {
            --bg: #05070b;
            --card: #151922e6;
            --line: #272d38;
            --txt: #edf2f7;
            --sub: #9aa4b2;
            --on: #2dbb63;
            --off: #3a4351;
            --danger: #ff6a55;
            --accent: #58a6ff;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 14px 12px 30px;
            font: 14px/1.45 system-ui, sans-serif;
            color: var(--txt);
            background:
                radial-gradient(circle at top, rgba(88, 166, 255, 0.18), transparent 38%),
                linear-gradient(#0a0d12, #05070b);
            min-height: 100vh;
        }
        .c {
            max-width: 560px;
            margin: auto;
            padding: 18px;
            border: 1px solid #ffffff12;
            border-radius: 24px;
            background: var(--card);
            box-shadow: 0 22px 56px rgba(0, 0, 0, .45);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            flex-wrap: wrap;
        }
        h1 {
            margin: 0;
            font-size: 22px;
        }
        p {
            margin: 8px 0 0;
            color: var(--sub);
            font-size: 13px;
        }
        .lang-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .lang-label {
            color: var(--sub);
            font-size: 12px;
            white-space: nowrap;
        }
        .r {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 14px 0;
            border-top: 1px solid var(--line);
            flex-wrap: wrap;
        }
        .k {
            flex: 1;
            min-width: 200px;
        }
        .k b {
            display: block;
            font-size: 15px;
        }
        .k span {
            display: block;
            margin-top: 4px;
            color: var(--sub);
            font-size: 12px;
        }
        .n {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            gap: 12px;
        }
        .v {
            font-size: 18px;
            font-weight: 700;
            color: #5de08f;
        }
        .d {
            opacity: .52;
            pointer-events: none;
        }
        .sel-ui,
        .input-ui,
        .btn-ui {
            border-radius: 10px;
            font-size: 13px;
        }
        .sel-ui {
            padding: 8px 12px;
            background: var(--off);
            color: var(--txt);
            border: 1px solid var(--line);
            outline: 0;
            font-weight: 700;
            cursor: pointer;
        }
        .input-ui {
            flex: 1;
            padding: 9px 12px;
            border: 1px solid var(--off);
            background: transparent;
            color: var(--txt);
            min-width: 0;
        }
        .btn-ui {
            padding: 9px 16px;
            border: 0;
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
            color: #000;
            background: var(--on);
        }
        .btn-ui.secondary {
            background: #233040;
            color: var(--txt);
        }
        .btn-ui:active {
            transform: scale(.97);
        }
        .w {
            position: relative;
            width: 50px;
            height: 30px;
            flex: none;
        }
        .w input {
            opacity: 0;
            width: 0;
            height: 0;
            position: absolute;
        }
        .w i {
            position: absolute;
            inset: 0;
            border-radius: 999px;
            background: var(--off);
            transition: .23s;
        }
        .w i:before {
            content: "";
            position: absolute;
            left: 4px;
            bottom: 4px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #f8fafc;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .35);
            transition: .23s;
        }
        input:checked + i {
            background: var(--on);
        }
        input:checked + i:before {
            transform: translateX(18px);
        }
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 999px;
            background: linear-gradient(to right, var(--on) var(--p, 0%), #445062 var(--p, 0%));
            outline: 0;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #f8fafc;
            border: 4px solid var(--on);
            box-shadow: 0 4px 10px rgba(45, 187, 99, .28);
        }
        input[disabled],
        input[disabled] + i {
            cursor: not-allowed;
            filter: grayscale(.8);
        }
        .stack {
            display: flex;
            gap: 8px;
            width: 100%;
            flex-wrap: wrap;
        }
        .app-list {
            width: 100%;
        }
        .app-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            background: #202632;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-top: 8px;
            border: 1px solid var(--line);
        }
        .app-item span {
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .app-item button {
            background: transparent;
            color: var(--danger);
            border: 0;
            cursor: pointer;
            font-weight: 700;
            padding: 4px 8px;
        }
        .hint {
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: rgba(15, 19, 26, .72);
            color: var(--sub);
            font-size: 12px;
        }
        .hint strong {
            color: var(--accent);
        }
        .actions {
            display: flex;
            gap: 8px;
            width: 100%;
            margin-top: 2px;
            flex-wrap: wrap;
        }
        .x {
            position: fixed;
            left: 50%;
            bottom: 30px;
            transform: translate(-50%, 16px);
            padding: 10px 16px;
            border-radius: 999px;
            background: #0f131ad9;
            color: #f8fafc;
            font-size: 13px;
            opacity: 0;
            visibility: hidden;
            transition: .25s;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .x.s {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, 0);
        }
    </style>
</head>
<body>
<div class="c">
    <div class="topbar">
        <div>
            <h1 id="title">OmniSched</h1>
            <p id="subtitle"></p>
        </div>
        <div class="lang-wrap">
            <span class="lang-label" id="lang_label"></span>
            <select id="language" class="sel-ui">
                <option value="zh-Hant">繁中</option>
                <option value="zh-Hans">简中</option>
                <option value="en">English</option>
            </select>
        </div>
    </div>

    <div class="r" id="row_power">
        <div class="k">
            <b id="power_title"></b>
            <span id="power_desc"></span>
        </div>
        <select id="power" class="sel-ui"></select>
    </div>

    <div class="r">
        <div class="k">
            <b id="vk_title"></b>
            <span id="vk_desc"></span>
        </div>
        <select id="vk_mode" class="sel-ui"></select>
        <div id="vk_app_mgr" class="stack" style="display:none">
            <input type="text" id="app_pkg" class="input-ui">
            <button id="add_app" class="btn-ui"></button>
            <div id="app_list" class="app-list"></div>
        </div>
    </div>

    <div class="r">
        <div class="k">
            <b id="auto_title"></b>
            <span id="auto_desc"></span>
        </div>
        <label class="w"><input id="auto_optimize" type="checkbox"><i></i></label>
    </div>

    <div class="r" id="row_poll">
        <div class="k">
            <div class="n">
                <b id="poll_title"></b>
                <span class="v" id="poll_value">950</span>
            </div>
            <input id="poll_interval" type="range" min="300" max="3600" step="50" value="950">
        </div>
    </div>

    <div class="r" id="row_bg">
        <div class="k">
            <b id="bg_title"></b>
            <span id="bg_desc"></span>
        </div>
        <label class="w"><input id="background_little" type="checkbox"><i></i></label>
    </div>

    <div class="r" id="row_lite">
        <div class="k">
            <b id="lite_title"></b>
            <span id="lite_desc"></span>
        </div>
        <label class="w"><input id="lite_mode" type="checkbox"><i></i></label>
    </div>

    <div class="actions">
        <button id="save_now" class="btn-ui"></button>
        <button id="reset_defaults" class="btn-ui secondary"></button>
    </div>

    <div class="hint">
        <div><strong id="config_path_label"></strong></div>
        <div id="config_path">Checking...</div>
    </div>
</div>
<div class="x" id="toast">Saved</div>

<script>
    const LEGACY_CONFIG_DIR = "/data/adb/omnisched";
    const MODULE_CONFIG_DIR = "/data/adb/zygisk_omnisched";
    const LEGACY_CONFIG_PATH = `${LEGACY_CONFIG_DIR}/config.json`;
    const MODULE_CONFIG_PATH = `${MODULE_CONFIG_DIR}/config.json`;
    const LANGUAGE_STORAGE_KEY = "omnisched.webui.language";
    const DEFAULT_STATE = {
        poll_interval_seconds: 950,
        cpuset: { background_little_core_only: true },
        render: { vulkan_mode: "off", vulkan_apps: [] },
        power: { policy: "balanced" },
        performance: { lite_mode: false, auto_optimize: false }
    };
    const AUTO_PROFILE = {
        poll_interval_seconds: 600,
        background_little_core_only: true,
        power_policy: "balanced"
    };
    const PACKAGE_NAME_PATTERN = /^[A-Za-z0-9_]+(\.[A-Za-z0-9_]+)+$/;
    const TRANSLATIONS = {
        "zh-Hant": {
            pageTitle: "OmniSched",
            subtitle: "設定會直接寫入目前使用中的配置檔，daemon 與 Zygisk 共用同一份資料來源。",
            languageLabel: "語言",
            powerTitle: "電源策略",
            powerDesc: "快速切換省電、均衡與效能導向的 CPU 調度強度。",
            powerOptions: {
                powersave: "省電",
                balanced: "均衡",
                performance: "效能"
            },
            vkTitle: "Vulkan 模式",
            vkDesc: "`per_app` 只會對指定 App 注入 Vulkan 環境，不會全域強推。",
            vkOptions: {
                off: "關閉",
                global: "全域",
                per_app: "分應用"
            },
            appPlaceholder: "輸入套件名，例如 com.miHoYo.ys",
            addApp: "新增",
            removeApp: "移除",
            autoTitle: "智慧自動最佳化",
            autoDesc: "啟用後會套用較保守的輪詢與背景限制，優先確保穩定性。",
            pollTitle: "兜底巡檢間隔",
            bgTitle: "背景小核限制",
            bgDesc: "優先把背景程序留在小核；若裝置沒有小核資訊，會自動退回安全配置。",
            liteTitle: "Lite 模式",
            liteDesc: "降低 governor 與 GPU 調整強度，適合想保守使用的人。",
            saveNow: "立即儲存",
            resetDefaults: "重置預設",
            configPathLabel: "目前設定檔",
            configPathLoading: "檢查中...",
            toastSaved: "設定已儲存",
            toastReapplied: "設定已重新套用",
            toastReset: "已恢復預設設定",
            toastAppAdded: "已加入 Vulkan 名單",
            toastAppRemoved: "已移除套件",
            toastInvalidPackage: "套件名格式不正確"
        },
        "zh-Hans": {
            pageTitle: "OmniSched",
            subtitle: "设置会直接写入当前使用中的配置文件，daemon 与 Zygisk 共用同一份数据来源。",
            languageLabel: "语言",
            powerTitle: "电源策略",
            powerDesc: "快速切换省电、均衡与性能导向的 CPU 调度强度。",
            powerOptions: {
                powersave: "省电",
                balanced: "均衡",
                performance: "性能"
            },
            vkTitle: "Vulkan 模式",
            vkDesc: "`per_app` 只会对指定 App 注入 Vulkan 环境，不会全局强推。",
            vkOptions: {
                off: "关闭",
                global: "全局",
                per_app: "分应用"
            },
            appPlaceholder: "输入包名，例如 com.miHoYo.ys",
            addApp: "新增",
            removeApp: "移除",
            autoTitle: "智能自动优化",
            autoDesc: "启用后会套用更保守的轮询与后台限制，优先确保稳定性。",
            pollTitle: "兜底巡检间隔",
            bgTitle: "后台小核限制",
            bgDesc: "优先把后台进程留在小核；如果设备没有小核信息，会自动回退到安全配置。",
            liteTitle: "Lite 模式",
            liteDesc: "降低 governor 与 GPU 调整强度，适合偏保守使用的人。",
            saveNow: "立即保存",
            resetDefaults: "重置默认",
            configPathLabel: "当前配置文件",
            configPathLoading: "检查中...",
            toastSaved: "设置已保存",
            toastReapplied: "设置已重新套用",
            toastReset: "已恢复默认设置",
            toastAppAdded: "已加入 Vulkan 列表",
            toastAppRemoved: "已移除包名",
            toastInvalidPackage: "包名格式不正确"
        },
        en: {
            pageTitle: "OmniSched",
            subtitle: "Settings are written directly to the active config file shared by the daemon and Zygisk.",
            languageLabel: "Language",
            powerTitle: "Power Policy",
            powerDesc: "Quickly switch CPU scheduling behavior between battery, balanced, and performance modes.",
            powerOptions: {
                powersave: "Battery",
                balanced: "Balanced",
                performance: "Performance"
            },
            vkTitle: "Vulkan Mode",
            vkDesc: "`per_app` injects the Vulkan environment only into selected apps instead of forcing it system-wide.",
            vkOptions: {
                off: "Off",
                global: "Global",
                per_app: "Per App"
            },
            appPlaceholder: "Enter package name, for example com.miHoYo.ys",
            addApp: "Add",
            removeApp: "Remove",
            autoTitle: "Smart Auto Optimize",
            autoDesc: "Uses a more conservative polling interval and background policy to prioritize stability.",
            pollTitle: "Fallback Poll Interval",
            bgTitle: "Background Little-Core Limit",
            bgDesc: "Keeps background tasks on little cores when possible, with safe fallback behavior on unknown topologies.",
            liteTitle: "Lite Mode",
            liteDesc: "Reduces governor and GPU tuning intensity for a more conservative profile.",
            saveNow: "Save Now",
            resetDefaults: "Reset Defaults",
            configPathLabel: "Active Config File",
            configPathLoading: "Checking...",
            toastSaved: "Settings saved",
            toastReapplied: "Settings reapplied",
            toastReset: "Defaults restored",
            toastAppAdded: "Added to Vulkan list",
            toastAppRemoved: "Removed package",
            toastInvalidPackage: "Invalid package name format"
        }
    };

    let activeConfigDir = MODULE_CONFIG_DIR;
    let activeConfigPath = MODULE_CONFIG_PATH;
    let currentLanguage = "zh-Hant";
    let toastTimer;
    let state = clone(DEFAULT_STATE);

    const $ = id => document.getElementById(id);
    const titleNode = $("title");
    const subtitleNode = $("subtitle");
    const languageLabelNode = $("lang_label");
    const languageSelect = $("language");
    const pollSlider = $("poll_interval");
    const pollValue = $("poll_value");
    const powerPolicy = $("power");
    const vulkanMode = $("vk_mode");
    const autoOptimize = $("auto_optimize");
    const backgroundLittle = $("background_little");
    const liteMode = $("lite_mode");
    const appInput = $("app_pkg");
    const appList = $("app_list");
    const configPathNode = $("config_path");
    const vkManager = $("vk_app_mgr");
    const toastNode = $("toast");
    const lockableControls = [pollSlider, powerPolicy, backgroundLittle, liteMode];
    const lockableRows = [
        $("row_poll"),
        $("row_power"),
        $("row_bg"),
        $("row_lite")
    ];

    function clone(value) {
        return JSON.parse(JSON.stringify(value));
    }

    function fillRange(node) {
        node.style.setProperty("--p", `${((node.value - node.min) / (node.max - node.min)) * 100}%`);
    }

    function getText() {
        return TRANSLATIONS[currentLanguage] || TRANSLATIONS["zh-Hant"];
    }

    function detectLanguage() {
        const saved = localStorage.getItem(LANGUAGE_STORAGE_KEY);
        if (saved && TRANSLATIONS[saved]) return saved;

        const browserLanguage = (navigator.language || "").toLowerCase();
        if (browserLanguage.startsWith("zh-cn") || browserLanguage.startsWith("zh-sg")) return "zh-Hans";
        if (browserLanguage.startsWith("zh")) return "zh-Hant";
        if (browserLanguage.startsWith("en")) return "en";
        return "zh-Hant";
    }

    function setSelectOptions(selectNode, options, value) {
        selectNode.innerHTML = "";
        Object.entries(options).forEach(([optionValue, label]) => {
            const option = document.createElement("option");
            option.value = optionValue;
            option.textContent = label;
            selectNode.appendChild(option);
        });
        selectNode.value = value;
    }

    function applyLanguage() {
        const text = getText();

        document.documentElement.lang = currentLanguage;
        titleNode.textContent = text.pageTitle;
        subtitleNode.textContent = text.subtitle;
        languageLabelNode.textContent = text.languageLabel;
        $("power_title").textContent = text.powerTitle;
        $("power_desc").textContent = text.powerDesc;
        $("vk_title").textContent = text.vkTitle;
        $("vk_desc").textContent = text.vkDesc;
        $("auto_title").textContent = text.autoTitle;
        $("auto_desc").textContent = text.autoDesc;
        $("poll_title").textContent = text.pollTitle;
        $("bg_title").textContent = text.bgTitle;
        $("bg_desc").textContent = text.bgDesc;
        $("lite_title").textContent = text.liteTitle;
        $("lite_desc").textContent = text.liteDesc;
        $("save_now").textContent = text.saveNow;
        $("reset_defaults").textContent = text.resetDefaults;
        $("config_path_label").textContent = text.configPathLabel;
        appInput.placeholder = text.appPlaceholder;
        $("add_app").textContent = text.addApp;

        if (!activeConfigPath) {
            configPathNode.textContent = text.configPathLoading;
        }

        setSelectOptions(powerPolicy, text.powerOptions, state.power.policy);
        setSelectOptions(vulkanMode, text.vkOptions, state.render.vulkan_mode);
        paintAppList();
    }

    function showToast(message) {
        toastNode.textContent = message;
        clearTimeout(toastTimer);
        toastNode.classList.add("s");
        toastTimer = setTimeout(() => toastNode.classList.remove("s"), 1800);
    }

    function toastFor(key) {
        const text = getText();
        showToast(text[key] || text.toastSaved);
    }

    function shellEscape(value) {
        return value.replace(/'/g, "'\\''");
    }

    async function exec(command) {
        const result = await ksu.exec(command);
        return typeof result === "string" ? result : (result?.stdout || "");
    }

    async function pathExists(path) {
        const output = (await exec(`[ -e ${path} ] && echo 1 || echo 0`)).trim();
        return output === "1";
    }

    async function resolveActiveConfigTarget() {
        if (await pathExists(LEGACY_CONFIG_PATH)) {
            activeConfigDir = LEGACY_CONFIG_DIR;
            activeConfigPath = LEGACY_CONFIG_PATH;
            return;
        }
        if (await pathExists(MODULE_CONFIG_PATH)) {
            activeConfigDir = MODULE_CONFIG_DIR;
            activeConfigPath = MODULE_CONFIG_PATH;
            return;
        }
        if (await pathExists(LEGACY_CONFIG_DIR)) {
            activeConfigDir = LEGACY_CONFIG_DIR;
            activeConfigPath = LEGACY_CONFIG_PATH;
            return;
        }
        activeConfigDir = MODULE_CONFIG_DIR;
        activeConfigPath = MODULE_CONFIG_PATH;
    }

    function sanitizePackages(packages) {
        return [...new Set(packages.map(value => value.trim()).filter(Boolean))].sort((left, right) => left.localeCompare(right));
    }

    function buildPersistedState() {
        const persisted = clone(state);
        persisted.render.vulkan_apps = sanitizePackages(persisted.render.vulkan_apps);

        if (persisted.performance.auto_optimize) {
            persisted.poll_interval_seconds = AUTO_PROFILE.poll_interval_seconds;
            persisted.cpuset.background_little_core_only = AUTO_PROFILE.background_little_core_only;
            persisted.power.policy = AUTO_PROFILE.power_policy;
        }

        return persisted;
    }

    function paintAppList() {
        const text = getText();
        appList.innerHTML = "";

        state.render.vulkan_apps.forEach((packageName, index) => {
            const item = document.createElement("div");
            item.className = "app-item";
            item.innerHTML = `<span>${packageName}</span><button type="button" data-index="${index}">${text.removeApp}</button>`;
            appList.appendChild(item);
        });
    }

    function paint() {
        const locked = state.performance.auto_optimize;
        const displayedPoll = locked ? AUTO_PROFILE.poll_interval_seconds : state.poll_interval_seconds;
        const displayedBackground = locked ? AUTO_PROFILE.background_little_core_only : state.cpuset.background_little_core_only;

        autoOptimize.checked = locked;
        pollSlider.value = displayedPoll;
        pollValue.textContent = displayedPoll;
        backgroundLittle.checked = displayedBackground;
        liteMode.checked = state.performance.lite_mode;
        powerPolicy.value = locked ? AUTO_PROFILE.power_policy : state.power.policy;
        vulkanMode.value = state.render.vulkan_mode;
        vkManager.style.display = state.render.vulkan_mode === "per_app" ? "flex" : "none";
        configPathNode.textContent = activeConfigPath || getText().configPathLoading;

        lockableControls.forEach(node => {
            node.disabled = locked;
        });
        lockableRows.forEach(node => {
            node.classList.toggle("d", locked);
        });

        fillRange(pollSlider);
        paintAppList();
    }

    async function save(toastKey = "toastSaved") {
        const persisted = buildPersistedState();
        const payload = shellEscape(JSON.stringify(persisted, null, 2));
        await exec(`mkdir -p ${activeConfigDir} && printf '%s\n' '${payload}' > ${activeConfigPath}.tmp && mv ${activeConfigPath}.tmp ${activeConfigPath}`);
        state.render.vulkan_apps = persisted.render.vulkan_apps;
        toastFor(toastKey);
        paint();
    }

    async function load() {
        currentLanguage = detectLanguage();
        languageSelect.value = currentLanguage;
        applyLanguage();

        await resolveActiveConfigTarget();

        try {
            const raw = (await exec(`cat ${activeConfigPath}`)).trim();
            if (raw.startsWith("{")) {
                const parsed = JSON.parse(raw);
                state = clone(DEFAULT_STATE);
                state.poll_interval_seconds = parsed.poll_interval_seconds ?? state.poll_interval_seconds;
                state.cpuset.background_little_core_only =
                    parsed.cpuset?.background_little_core_only ?? state.cpuset.background_little_core_only;
                state.performance.auto_optimize =
                    parsed.performance?.auto_optimize ?? state.performance.auto_optimize;
                state.performance.lite_mode =
                    parsed.performance?.lite_mode ?? state.performance.lite_mode;
                state.render.vulkan_mode = typeof parsed.render?.force_vulkan === "boolean"
                    ? (parsed.render.force_vulkan ? "global" : "off")
                    : (parsed.render?.vulkan_mode ?? state.render.vulkan_mode);
                state.render.vulkan_apps = sanitizePackages(parsed.render?.vulkan_apps ?? []);
                state.power.policy = parsed.power?.policy ?? state.power.policy;
            }
        } catch (_) {}

        applyLanguage();
        paint();
    }

    languageSelect.onchange = () => {
        currentLanguage = languageSelect.value;
        localStorage.setItem(LANGUAGE_STORAGE_KEY, currentLanguage);
        applyLanguage();
        paint();
    };

    pollSlider.oninput = event => {
        pollValue.textContent = event.target.value;
        fillRange(event.target);
    };
    pollSlider.onchange = () => {
        state.poll_interval_seconds = parseInt(pollSlider.value, 10);
        save();
    };
    backgroundLittle.onchange = () => {
        state.cpuset.background_little_core_only = backgroundLittle.checked;
        save();
    };
    liteMode.onchange = () => {
        state.performance.lite_mode = liteMode.checked;
        save();
    };
    autoOptimize.onchange = () => {
        state.performance.auto_optimize = autoOptimize.checked;
        save();
    };
    powerPolicy.onchange = () => {
        state.power.policy = powerPolicy.value;
        save();
    };
    vulkanMode.onchange = () => {
        state.render.vulkan_mode = vulkanMode.value;
        paint();
        save();
    };

    $("add_app").onclick = () => {
        const packageName = appInput.value.trim();
        if (!packageName) return;
        if (!PACKAGE_NAME_PATTERN.test(packageName)) {
            toastFor("toastInvalidPackage");
            return;
        }
        if (!state.render.vulkan_apps.includes(packageName)) {
            state.render.vulkan_apps.push(packageName);
            appInput.value = "";
            save("toastAppAdded");
        }
    };

    appList.onclick = event => {
        const button = event.target.closest("button[data-index]");
        if (!button) return;
        const index = parseInt(button.dataset.index, 10);
        state.render.vulkan_apps.splice(index, 1);
        save("toastAppRemoved");
    };

    $("save_now").onclick = () => save("toastReapplied");
    $("reset_defaults").onclick = () => {
        state = clone(DEFAULT_STATE);
        paint();
        save("toastReset");
    };

    load();
</script>
</body>
</html>
