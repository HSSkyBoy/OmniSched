<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Zygisk OmniSched</title>
    <style>
        :root {
            --bg: #0b0c0d;
            --surface: #151715;
            --surface-2: #1f221f;
            --surface-3: #282c28;
            --line: #353b34;
            --line-strong: #50574d;
            --txt: #f6f3eb;
            --dim: #858b80;
            --ok: #48d47e;
            --ok-ink: #06100a;
            --warn: #f2b95f;
            --danger: #ff7a66;
            --accent: #4abcae;
        }
        * {
            box-sizing: border-box;
        }
        html {
            color-scheme: dark;
        }
        body {
            margin: 0;
            min-height: 100dvh;
            padding: max(10px, env(safe-area-inset-top)) 10px max(18px, env(safe-area-inset-bottom));
            color: var(--txt);
            background: var(--bg);
            font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        button,
        select,
        input,
        textarea {
            font: inherit;
        }
        .app-shell {
            width: min(100%, 560px);
            margin: 0 auto;
            display: grid;
            gap: 8px;
        }
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 0 2px 2px;
        }
        h1 {
            margin: 0;
            font-size: 21px;
            line-height: 1.12;
            font-weight: 750;
            letter-spacing: 0;
        }
        .lang-wrap {
            display: grid;
            gap: 4px;
            min-width: 104px;
        }
        .label,
        .meta-label {
            color: var(--dim);
            font-size: 12px;
            font-weight: 650;
        }
        .status-panel,
        .section {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            overflow: hidden;
        }
        .status-panel {
            display: grid;
            gap: 8px;
            padding: 7px 8px;
            background: var(--surface-2);
        }
        .status-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 8px;
        }
        #config_path,
        #config_source {
            margin-top: 2px;
            color: var(--txt);
            font-size: 12px;
            overflow-wrap: anywhere;
        }
        #config_source {
            color: var(--dim);
        }
        .actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            flex-wrap: wrap;
        }
        .r {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 8px;
            padding: 8px;
            border-top: 1px solid var(--line);
        }
        .section > .r:first-child {
            border-top: 0;
        }
        .r.range-row {
            grid-template-columns: 1fr;
        }
        .k {
            min-width: 0;
        }
        .k b {
            display: block;
            font-size: 14px;
            line-height: 1.35;
            font-weight: 720;
        }
        .n {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 7px;
        }
        .v {
            min-width: 48px;
            padding: 2px 6px;
            border: 1px solid rgba(72, 212, 126, .35);
            border-radius: 8px;
            color: var(--ok);
            background: rgba(72, 212, 126, .09);
            text-align: center;
            font-size: 13px;
            font-weight: 760;
            font-variant-numeric: tabular-nums;
        }
        .d {
            opacity: .5;
        }
        .sel-ui,
        .input-ui,
        .btn-ui {
            border-radius: 8px;
            border: 1px solid var(--line-strong);
            outline: 0;
        }
        .sel-ui {
            min-width: 104px;
            min-height: 38px;
            padding: 6px 9px;
            color: var(--txt);
            background: var(--surface-3);
            cursor: pointer;
            font-size: 13px;
            font-weight: 650;
        }
        .input-ui {
            width: 100%;
            min-width: 0;
            color: var(--txt);
            background: #101110;
        }
        textarea.input-ui {
            min-height: 76px;
            padding: 7px 9px;
            resize: vertical;
            line-height: 1.55;
            font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 12px;
        }
        .input-label {
            display: block;
            margin-bottom: 5px;
            color: var(--dim);
            font-size: 12px;
            font-weight: 650;
        }
        .btn-ui {
            min-height: 38px;
            padding: 6px 10px;
            color: var(--ok-ink);
            background: var(--ok);
            cursor: pointer;
            font-size: 13px;
            font-weight: 760;
            transition: transform .18s ease, background-color .18s ease, border-color .18s ease;
        }
        .btn-ui.secondary {
            color: var(--txt);
            background: transparent;
            border-color: var(--line-strong);
        }
        .btn-ui.warning {
            color: #181007;
            background: var(--warn);
            border-color: rgba(242, 185, 95, .8);
        }
        .btn-ui:active {
            transform: scale(.98);
        }
        .btn-ui:focus-visible,
        .sel-ui:focus-visible,
        .input-ui:focus-visible,
        .w input:focus-visible + i {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        .w {
            position: relative;
            width: 48px;
            height: 28px;
            flex: none;
        }
        .w input {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
        }
        .w i {
            position: absolute;
            inset: 0;
            border: 1px solid var(--line-strong);
            border-radius: 999px;
            background: #252824;
            cursor: pointer;
            transition: background-color .2s ease, border-color .2s ease;
        }
        .w i:before {
            content: "";
            position: absolute;
            left: 4px;
            top: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #f6f3eb;
            box-shadow: 0 3px 10px rgba(0, 0, 0, .38);
            transition: transform .2s ease;
        }
        input:checked + i {
            border-color: rgba(72, 212, 126, .7);
            background: rgba(72, 212, 126, .9);
        }
        input:checked + i:before {
            transform: translateX(20px);
        }
        input[type=range] {
            width: 100%;
            height: 7px;
            border-radius: 999px;
            outline: 0;
            appearance: none;
            -webkit-appearance: none;
            background: linear-gradient(to right, var(--ok) var(--p, 0%), #3a3d38 var(--p, 0%));
        }
        input[type=range]::-webkit-slider-thumb {
            width: 20px;
            height: 20px;
            border: 3px solid var(--surface);
            border-radius: 50%;
            background: var(--ok);
            box-shadow: 0 0 0 1px rgba(72, 212, 126, .55);
            -webkit-appearance: none;
        }
        input[type=range]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border: 3px solid var(--surface);
            border-radius: 50%;
            background: var(--ok);
            box-shadow: 0 0 0 1px rgba(72, 212, 126, .55);
        }
        input[disabled],
        input[disabled] + i,
        select[disabled] {
            cursor: not-allowed;
            filter: grayscale(.65);
        }
        .stack {
            grid-column: 1 / -1;
            width: 100%;
        }
        .stack[hidden] {
            display: none;
        }
        .x {
            position: fixed;
            left: 50%;
            bottom: max(22px, env(safe-area-inset-bottom));
            z-index: 20;
            max-width: calc(100vw - 28px);
            padding: 9px 13px;
            border: 1px solid rgba(246, 243, 235, .12);
            border-radius: 999px;
            color: var(--txt);
            background: rgba(19, 20, 18, .94);
            box-shadow: 0 8px 20px rgba(0, 0, 0, .32);
            opacity: 0;
            visibility: hidden;
            transform: translate(-50%, 12px);
            transition: opacity .2s ease, transform .2s ease, visibility .2s ease;
            font-size: 13px;
        }
        .x.s {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, 0);
        }
        .x.error {
            border-color: rgba(255, 122, 102, .35);
            color: #ffe2dc;
        }
        @media (max-width: 560px) {
            .status-grid {
                grid-template-columns: 1fr;
            }
            .lang-wrap,
            .sel-ui,
            .actions,
            .btn-ui {
                width: 100%;
            }
            .actions {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }
            .sel-ui {
                min-width: 0;
            }
            .w {
                justify-self: end;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition-duration: .01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
<main class="app-shell">
    <header class="app-header">
        <h1 id="title">OmniSched</h1>
        <label class="lang-wrap" for="language">
            <span class="label" id="lang_label"></span>
            <select id="language" class="sel-ui" aria-labelledby="lang_label">
                <option value="zh-Hant">繁中</option>
                <option value="zh-Hans">简中</option>
                <option value="en">English</option>
            </select>
        </label>
    </header>

    <section class="status-panel" aria-labelledby="config_path_label">
        <div class="status-grid">
            <div>
                <div class="meta-label" id="config_path_label"></div>
                <div id="config_path"></div>
                <div id="config_source"></div>
            </div>
            <div class="actions">
                <button id="reload_now" class="btn-ui secondary" type="button"></button>
                <button id="save_now" class="btn-ui" type="button"></button>
                <button id="reset_defaults" class="btn-ui warning" type="button"></button>
            </div>
        </div>
    </section>

    <section class="section">
        <div class="r" id="row_power">
            <div class="k"><b id="power_title"></b></div>
            <select id="power" class="sel-ui" aria-labelledby="power_title"></select>
        </div>
        <div class="r">
            <div class="k"><b id="auto_title"></b></div>
            <label class="w" for="auto_optimize"><input id="auto_optimize" type="checkbox" aria-labelledby="auto_title"><i></i></label>
        </div>
        <div class="r">
            <div class="k"><b id="vk_title"></b></div>
            <select id="vk_mode" class="sel-ui" aria-labelledby="vk_title"></select>
            <div id="vk_app_mgr" class="stack" hidden>
                <label class="input-label" for="app_pkg" id="app_pkg_label"></label>
                <textarea id="app_pkg" class="input-ui" spellcheck="false"></textarea>
            </div>
        </div>
        <div class="r range-row" id="row_poll">
            <div class="k">
                <div class="n">
                    <b id="poll_title"></b>
                    <span class="v" id="poll_value">950</span>
                </div>
                <input id="poll_interval" type="range" min="300" max="3600" step="50" value="950" aria-labelledby="poll_title">
            </div>
        </div>
        <div class="r" id="row_bg">
            <div class="k"><b id="bg_title"></b></div>
            <label class="w" for="background_little"><input id="background_little" type="checkbox" aria-labelledby="bg_title"><i></i></label>
        </div>
        <div class="r" id="row_lite">
            <div class="k"><b id="lite_title"></b></div>
            <label class="w" for="lite_mode"><input id="lite_mode" type="checkbox" aria-labelledby="lite_title"><i></i></label>
        </div>
    </section>
</main>
<div class="x" id="toast" aria-live="polite">Saved</div>

<script>
    const CANONICAL_CONFIG_DIR = "/data/adb/zygisk_omnisched";
    const CANONICAL_CONFIG_PATH = `${CANONICAL_CONFIG_DIR}/config.json`;
    const LEGACY_CONFIG_PATH = "/data/adb/omnisched/config.json";
    const LANGUAGE_STORAGE_KEY = "omnisched.webui.language";
    const PACKAGE_NAME_PATTERN = /^[A-Za-z0-9_]+(\.[A-Za-z0-9_]+)+$/;
    const DEFAULT_STATE = Object.freeze({
        poll_interval_seconds: 950,
        cpuset: { background_little_core_only: true },
        render: { vulkan_mode: "off", vulkan_apps: [] },
        power: { policy: "balanced" },
        performance: { lite_mode: false, auto_optimize: false }
    });
    const AUTO_PROFILE = Object.freeze({
        poll_interval_seconds: 600,
        background_little_core_only: true,
        power_policy: "balanced"
    });
    const TRANSLATIONS = {
        "zh-Hant": {
            pageTitle: "OmniSched",
            languageLabel: "語言",
            powerTitle: "電源策略",
            powerOptions: { powersave: "省電", balanced: "均衡", performance: "效能" },
            vkTitle: "Vulkan 模式",
            vkOptions: { off: "關閉", global: "全域", per_app: "分應用" },
            appListLabel: "分應用套件名",
            appPlaceholder: "每行一個套件名，例如：\ncom.miHoYo.ys\ncom.example.game",
            autoTitle: "智慧自動最佳化",
            pollTitle: "兜底巡檢間隔",
            bgTitle: "背景小核限制",
            liteTitle: "Lite 模式",
            reloadNow: "重新讀取",
            saveNow: "儲存",
            resetDefaults: "重置",
            configPathLabel: "設定檔",
            sourcePrefix: "讀取來源",
            sourceMissing: "尚未建立，儲存後會建立",
            toastLoaded: "設定已重新讀取",
            toastSaved: "設定已儲存並回讀確認",
            toastReset: "已恢復預設設定",
            toastInvalidPackage: "套件名格式不正確",
            toastBridgeMissing: "無法連接 KernelSU WebUI 執行環境",
            toastReadFailed: "讀取設定失敗，已使用預設值",
            toastWriteFailed: "寫入設定失敗"
        },
        "zh-Hans": {
            pageTitle: "OmniSched",
            languageLabel: "语言",
            powerTitle: "电源策略",
            powerOptions: { powersave: "省电", balanced: "均衡", performance: "性能" },
            vkTitle: "Vulkan 模式",
            vkOptions: { off: "关闭", global: "全局", per_app: "分应用" },
            appListLabel: "分应用包名",
            appPlaceholder: "每行一个包名，例如：\ncom.miHoYo.ys\ncom.example.game",
            autoTitle: "智能自动优化",
            pollTitle: "兜底巡检间隔",
            bgTitle: "后台小核限制",
            liteTitle: "Lite 模式",
            reloadNow: "重新读取",
            saveNow: "保存",
            resetDefaults: "重置",
            configPathLabel: "配置文件",
            sourcePrefix: "读取来源",
            sourceMissing: "尚未建立，保存后会建立",
            toastLoaded: "设置已重新读取",
            toastSaved: "设置已保存并回读确认",
            toastReset: "已恢复默认设置",
            toastInvalidPackage: "包名格式不正确",
            toastBridgeMissing: "无法连接 KernelSU WebUI 执行环境",
            toastReadFailed: "读取配置失败，已使用默认值",
            toastWriteFailed: "写入配置失败"
        },
        en: {
            pageTitle: "OmniSched",
            languageLabel: "Language",
            powerTitle: "Power Policy",
            powerOptions: { powersave: "Battery", balanced: "Balanced", performance: "Performance" },
            vkTitle: "Vulkan Mode",
            vkOptions: { off: "Off", global: "Global", per_app: "Per App" },
            appListLabel: "Per-app package names",
            appPlaceholder: "One package name per line, for example:\ncom.miHoYo.ys\ncom.example.game",
            autoTitle: "Smart Auto Optimize",
            pollTitle: "Fallback Poll Interval",
            bgTitle: "Background Little-Core Limit",
            liteTitle: "Lite Mode",
            reloadNow: "Reload",
            saveNow: "Save",
            resetDefaults: "Reset",
            configPathLabel: "Config File",
            sourcePrefix: "Loaded from",
            sourceMissing: "Not created yet; saving will create it",
            toastLoaded: "Settings reloaded",
            toastSaved: "Settings saved and verified",
            toastReset: "Defaults restored",
            toastInvalidPackage: "Invalid package name format",
            toastBridgeMissing: "KernelSU WebUI bridge is unavailable",
            toastReadFailed: "Failed to read config; defaults are shown",
            toastWriteFailed: "Failed to write config"
        }
    };

    let activeSourcePath = "";
    let currentLanguage = "zh-Hant";
    let toastTimer;
    let state = clone(DEFAULT_STATE);

    const $ = id => document.getElementById(id);
    const languageSelect = $("language");
    const pollSlider = $("poll_interval");
    const pollValue = $("poll_value");
    const powerPolicy = $("power");
    const vulkanMode = $("vk_mode");
    const autoOptimize = $("auto_optimize");
    const backgroundLittle = $("background_little");
    const liteMode = $("lite_mode");
    const appInput = $("app_pkg");
    const configPathNode = $("config_path");
    const configSourceNode = $("config_source");
    const vkManager = $("vk_app_mgr");
    const toastNode = $("toast");
    const lockableControls = [pollSlider, powerPolicy, backgroundLittle, liteMode];
    const lockableRows = [$("row_poll"), $("row_power"), $("row_bg"), $("row_lite")];

    function clone(value) {
        return JSON.parse(JSON.stringify(value));
    }

    function clampNumber(value, fallback, min, max) {
        const number = Number(value);
        if (!Number.isFinite(number)) return fallback;
        return Math.min(max, Math.max(min, Math.round(number)));
    }

    function getText() {
        return TRANSLATIONS[currentLanguage] || TRANSLATIONS["zh-Hant"];
    }

    function readStoredLanguage() {
        try {
            const saved = localStorage.getItem(LANGUAGE_STORAGE_KEY);
            if (saved && TRANSLATIONS[saved]) return saved;
        } catch (_) {}

        const browserLanguage = (navigator.language || "").toLowerCase();
        if (browserLanguage.startsWith("zh-cn") || browserLanguage.startsWith("zh-sg")) return "zh-Hans";
        if (browserLanguage.startsWith("zh")) return "zh-Hant";
        if (browserLanguage.startsWith("en")) return "en";
        return "zh-Hant";
    }

    function storeLanguage(language) {
        try {
            localStorage.setItem(LANGUAGE_STORAGE_KEY, language);
        } catch (_) {}
    }

    function setSelectOptions(selectNode, options, value) {
        selectNode.innerHTML = "";
        Object.entries(options).forEach(([optionValue, label]) => {
            const option = document.createElement("option");
            option.value = optionValue;
            option.textContent = label;
            selectNode.appendChild(option);
        });
        selectNode.value = value;
    }

    function applyLanguage() {
        const text = getText();
        document.documentElement.lang = currentLanguage;
        document.title = `Zygisk ${text.pageTitle}`;
        $("title").textContent = text.pageTitle;
        $("lang_label").textContent = text.languageLabel;
        $("power_title").textContent = text.powerTitle;
        $("vk_title").textContent = text.vkTitle;
        $("auto_title").textContent = text.autoTitle;
        $("poll_title").textContent = text.pollTitle;
        $("bg_title").textContent = text.bgTitle;
        $("lite_title").textContent = text.liteTitle;
        $("reload_now").textContent = text.reloadNow;
        $("save_now").textContent = text.saveNow;
        $("reset_defaults").textContent = text.resetDefaults;
        $("config_path_label").textContent = text.configPathLabel;
        $("app_pkg_label").textContent = text.appListLabel;
        appInput.placeholder = text.appPlaceholder;
        setSelectOptions(powerPolicy, text.powerOptions, effectivePowerPolicy());
        setSelectOptions(vulkanMode, text.vkOptions, state.render.vulkan_mode);
        paintConfigInfo();
    }

    function showToast(message, isError = false) {
        toastNode.textContent = message;
        toastNode.classList.toggle("error", isError);
        clearTimeout(toastTimer);
        toastNode.classList.add("s");
        toastTimer = setTimeout(() => toastNode.classList.remove("s"), 2200);
    }

    function toastFor(key, isError = false) {
        const text = getText();
        showToast(text[key] || text.toastSaved, isError);
    }

    function shellQuote(value) {
        return `'${String(value).replace(/'/g, "'\\''")}'`;
    }

    function normalizeExecResult(result) {
        if (typeof result === "string") return result;
        if (!result || typeof result !== "object") return "";
        if (typeof result.stdout === "string") return result.stdout;
        if (typeof result.out === "string") return result.out;
        if (typeof result.result === "string") return result.result;
        return "";
    }

    async function runShell(command) {
        if (!window.ksu || typeof window.ksu.exec !== "function") {
            throw new Error("KSU WebUI bridge unavailable");
        }

        const result = await window.ksu.exec(command);
        if (result && typeof result === "object") {
            const code = result.errno ?? result.code ?? result.exitCode;
            if (typeof code === "number" && code !== 0) {
                throw new Error(result.stderr || `command failed: ${code}`);
            }
        }
        return normalizeExecResult(result);
    }

    async function fileExists(path) {
        const output = await runShell(`[ -f ${shellQuote(path)} ] && printf 1 || printf 0`);
        return output.trim() === "1";
    }

    async function resolveSourcePath() {
        if (await fileExists(CANONICAL_CONFIG_PATH)) return CANONICAL_CONFIG_PATH;
        if (await fileExists(LEGACY_CONFIG_PATH)) return LEGACY_CONFIG_PATH;
        return "";
    }

    async function readConfigText(path) {
        if (!path) return "";
        return runShell(`cat ${shellQuote(path)}`);
    }

    async function writeConfigText(payload) {
        const tmpPath = `${CANONICAL_CONFIG_PATH}.tmp`;
        const command = [
            `mkdir -p ${shellQuote(CANONICAL_CONFIG_DIR)}`,
            `printf '%s\\n' ${shellQuote(payload)} > ${shellQuote(tmpPath)}`,
            `mv ${shellQuote(tmpPath)} ${shellQuote(CANONICAL_CONFIG_PATH)}`,
            `chmod 0644 ${shellQuote(CANONICAL_CONFIG_PATH)}`
        ].join(" && ");
        await runShell(command);
    }

    function sanitizePackages(packages) {
        return [...new Set(packages.map(value => String(value).trim()).filter(Boolean))]
            .sort((left, right) => left.localeCompare(right));
    }

    function normalizeMode(value, fallback, allowed) {
        return allowed.includes(value) ? value : fallback;
    }

    function normalizeConfig(input) {
        const next = clone(DEFAULT_STATE);
        const data = input && typeof input === "object" ? input : {};
        const cpuset = data.cpuset && typeof data.cpuset === "object" ? data.cpuset : {};
        const render = data.render && typeof data.render === "object" ? data.render : {};
        const power = data.power && typeof data.power === "object" ? data.power : {};
        const performance = data.performance && typeof data.performance === "object" ? data.performance : {};

        next.poll_interval_seconds = clampNumber(
            data.poll_interval_seconds,
            DEFAULT_STATE.poll_interval_seconds,
            300,
            3600
        );
        next.cpuset.background_little_core_only =
            typeof cpuset.background_little_core_only === "boolean"
                ? cpuset.background_little_core_only
                : next.cpuset.background_little_core_only;
        next.power.policy = normalizeMode(power.policy, DEFAULT_STATE.power.policy, ["balanced", "performance", "powersave"]);
        next.performance.auto_optimize =
            typeof performance.auto_optimize === "boolean" ? performance.auto_optimize : next.performance.auto_optimize;
        next.performance.lite_mode =
            typeof performance.lite_mode === "boolean" ? performance.lite_mode : next.performance.lite_mode;

        if (typeof render.force_vulkan === "boolean") {
            next.render.vulkan_mode = render.force_vulkan ? "global" : "off";
        } else {
            next.render.vulkan_mode = normalizeMode(render.vulkan_mode, DEFAULT_STATE.render.vulkan_mode, ["off", "global", "per_app"]);
        }
        next.render.vulkan_apps = Array.isArray(render.vulkan_apps)
            ? sanitizePackages(render.vulkan_apps.filter(value => typeof value === "string"))
            : [];

        return next;
    }

    function parseConfig(raw) {
        if (!raw.trim()) return clone(DEFAULT_STATE);
        return normalizeConfig(JSON.parse(raw));
    }

    function readPackagesFromInput() {
        return sanitizePackages(appInput.value.split(/\r?\n/));
    }

    function syncAppsFromInput() {
        const packages = readPackagesFromInput();
        if (packages.some(packageName => !PACKAGE_NAME_PATTERN.test(packageName))) {
            toastFor("toastInvalidPackage", true);
            return false;
        }
        state.render.vulkan_apps = packages;
        appInput.value = packages.join("\n");
        return true;
    }

    function buildPersistedState() {
        const persisted = normalizeConfig(state);
        persisted.render.vulkan_apps = sanitizePackages(persisted.render.vulkan_apps);

        if (persisted.performance.auto_optimize) {
            persisted.poll_interval_seconds = AUTO_PROFILE.poll_interval_seconds;
            persisted.cpuset.background_little_core_only = AUTO_PROFILE.background_little_core_only;
            persisted.power.policy = AUTO_PROFILE.power_policy;
        }

        return persisted;
    }

    function effectivePowerPolicy() {
        return state.performance.auto_optimize ? AUTO_PROFILE.power_policy : state.power.policy;
    }

    function fillRange(node) {
        node.style.setProperty("--p", `${((node.value - node.min) / (node.max - node.min)) * 100}%`);
    }

    function paintConfigInfo() {
        const text = getText();
        configPathNode.textContent = CANONICAL_CONFIG_PATH;
        configSourceNode.textContent = activeSourcePath
            ? `${text.sourcePrefix}: ${activeSourcePath}`
            : text.sourceMissing;
    }

    function paint() {
        const locked = state.performance.auto_optimize;
        const displayedPoll = locked ? AUTO_PROFILE.poll_interval_seconds : state.poll_interval_seconds;
        const displayedBackground = locked ? AUTO_PROFILE.background_little_core_only : state.cpuset.background_little_core_only;

        autoOptimize.checked = locked;
        pollSlider.value = displayedPoll;
        pollValue.textContent = displayedPoll;
        backgroundLittle.checked = displayedBackground;
        liteMode.checked = state.performance.lite_mode;
        powerPolicy.value = effectivePowerPolicy();
        vulkanMode.value = state.render.vulkan_mode;
        vkManager.hidden = state.render.vulkan_mode !== "per_app";
        appInput.value = state.render.vulkan_apps.join("\n");

        lockableControls.forEach(node => {
            node.disabled = locked;
        });
        lockableRows.forEach(node => {
            node.classList.toggle("d", locked);
        });

        fillRange(pollSlider);
        paintConfigInfo();
    }

    async function loadConfig(showSuccess = false) {
        try {
            activeSourcePath = await resolveSourcePath();
            const raw = await readConfigText(activeSourcePath);
            state = parseConfig(raw);
            if (showSuccess) toastFor("toastLoaded");
        } catch (error) {
            state = clone(DEFAULT_STATE);
            activeSourcePath = "";
            toastFor(error.message.includes("bridge") ? "toastBridgeMissing" : "toastReadFailed", true);
        }

        applyLanguage();
        paint();
    }

    async function saveConfig(toastKey = "toastSaved") {
        if (!syncAppsFromInput()) return;

        const payload = JSON.stringify(buildPersistedState(), null, 2);
        try {
            await writeConfigText(payload);
            activeSourcePath = CANONICAL_CONFIG_PATH;
            const raw = await readConfigText(CANONICAL_CONFIG_PATH);
            state = parseConfig(raw);
            toastFor(toastKey);
        } catch (_) {
            toastFor("toastWriteFailed", true);
        }

        applyLanguage();
        paint();
    }

    function boot() {
        currentLanguage = readStoredLanguage();
        languageSelect.value = currentLanguage;
        applyLanguage();
        paint();
        loadConfig(false);
    }

    languageSelect.onchange = () => {
        currentLanguage = languageSelect.value;
        storeLanguage(currentLanguage);
        applyLanguage();
        paint();
    };
    pollSlider.oninput = event => {
        pollValue.textContent = event.target.value;
        fillRange(event.target);
    };
    pollSlider.onchange = () => {
        state.poll_interval_seconds = parseInt(pollSlider.value, 10);
        saveConfig();
    };
    backgroundLittle.onchange = () => {
        state.cpuset.background_little_core_only = backgroundLittle.checked;
        saveConfig();
    };
    liteMode.onchange = () => {
        state.performance.lite_mode = liteMode.checked;
        saveConfig();
    };
    autoOptimize.onchange = () => {
        state.performance.auto_optimize = autoOptimize.checked;
        saveConfig();
    };
    powerPolicy.onchange = () => {
        state.power.policy = powerPolicy.value;
        saveConfig();
    };
    vulkanMode.onchange = () => {
        state.render.vulkan_mode = vulkanMode.value;
        vkManager.hidden = state.render.vulkan_mode !== "per_app";
        saveConfig();
    };
    appInput.oninput = () => {
        state.render.vulkan_apps = readPackagesFromInput();
    };
    $("reload_now").onclick = () => loadConfig(true);
    $("save_now").onclick = () => saveConfig();
    $("reset_defaults").onclick = () => {
        state = clone(DEFAULT_STATE);
        paint();
        saveConfig("toastReset");
    };

    boot();
</script>
</body>
</html>
